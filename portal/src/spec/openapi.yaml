openapi: 3.0.3
info:
  title: ProofPay API
  version: 1.0.0
  description: |
    ProofPay holds community donations in escrow on PayPal and releases each stage payment
    only when photo evidence passes deterministic checks plus two independent AI reviewers.
    Plain code makes the decision; a human verifier handles held cases; every step is written
    to a hash-chained audit log.

    **Who can call what**

    | Role | How it identifies itself | Can do |
    |---|---|---|
    | Anyone | nothing | read projects and the audit log, donate |
    | Worker | `X-Worker-Key` (returned when the project is created) | upload evidence, see the current one-time code |
    | Verifier | `X-Verifier-Key` | read the review queue, approve or reject |
    | Organiser | `X-Organizer-Key` (only if the server sets one) | create projects |

    Money amounts are decimal strings or numbers in the project's currency (USD). The payee's
    email address is never returned by any endpoint.
  contact:
    name: ProofPay
    url: https://github.com/shreesh1802/tollgate
  license:
    name: MIT
    url: https://github.com/shreesh1802/tollgate/blob/main/LICENSE
servers:
- url: https://proofpay-on99.onrender.com
  description: 'Production: hosted demo (simulated payments, real AI reviewers)'
  x-environment: production
- url: http://localhost:3000
  description: 'Development: local server'
tags:
- name: Projects
  description: Create projects and read their public state and audit log.
- name: Donations
  description: Reserve money on PayPal. Nothing is taken until a stage is verified.
- name: Evidence
  description: Upload and view the photo evidence for each stage.
- name: Verification
  description: The human verifier queue for held cases.
- name: Service
  description: Health and configuration.
paths:
  /api/health:
    get:
      tags:
      - Service
      operationId: getHealth
      summary: Liveness check
      description: '`uptimeSeconds` lets an operator tell a restarting process from a routing problem.'
      responses:
        '200':
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - uptimeSeconds
                properties:
                  ok:
                    type: boolean
                    example: true
                    description: The ok.
                  uptimeSeconds:
                    type: integer
                    example: 3600
                    description: The uptime seconds.
                description: The get health object.
              example:
                ok: true
                uptimeSeconds: 3600
  /api/config:
    get:
      tags:
      - Service
      operationId: getConfig
      summary: How this server is configured
      description: Tells a client whether payments are mock or sandbox, whether reviews are simulated,
        and the upload size limit.
      responses:
        '200':
          description: Server configuration.
          content:
            application/json:
              schema:
                type: object
                required:
                - mode
                - reviewMode
                - simulatedReviews
                - maxUploadBytes
                properties:
                  mode:
                    type: string
                    enum:
                    - mock
                    - sandbox
                    description: The mode.
                    example: mock
                  reviewMode:
                    type: string
                    enum:
                    - demo
                    - claude
                    description: The review mode.
                    example: demo
                  simulatedReviews:
                    type: boolean
                    description: The simulated reviews.
                    example: true
                  maxUploadBytes:
                    type: integer
                    description: The max upload bytes.
                    example: 1
                  vendors:
                    type: array
                    items:
                      type: string
                      description: The vendors.
                      example: vendors
                    description: The vendors.
                    example: []
                  demo:
                    nullable: true
                    description: Present only on the hosted demo. Contains the demo project and role keys
                      so a visitor can try every role.
                    type: object
                    additionalProperties: true
                description: The get config object.
              example:
                mode: mock
                reviewMode: demo
                simulatedReviews: true
                maxUploadBytes: 1
                vendors:
                - vendors
                demo: {}
  /api/projects:
    get:
      tags:
      - Projects
      operationId: listProjects
      summary: List projects
      description: Also refreshes any payouts that PayPal has accepted but not yet settled.
      responses:
        '200':
          description: Every project, in short form.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
                description: The list projects object.
                example: []
    post:
      tags:
      - Projects
      operationId: createProject
      summary: Create a project
      description: |
        Stage percentages must add up to 100. Each stage has a time window in which its evidence
        must be photographed. The response contains the worker key; keep it, it is shown once.
      security:
      - {}
      - OrganizerKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProject'
            example: &id009
              title: Repair the village hand pump
              worker: &id007
                name: Ravi Kumar
                email: ravi@example.com
              site: &id001
                lat: 12.9716
                lon: 77.5946
                radiusM: 150
              stages: &id008
              - title: Repair the village hand pump
                spec: The new pump head is installed and bolted to the base.
                pct: 40
                window:
                  from: '2026-11-01T00:00:00Z'
                  to: '2026-11-30T23:59:59Z'
        description: The project to create.
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - workerKey
                - workerLink
                properties:
                  id:
                    type: string
                    description: The id.
                    example: id
                  workerKey:
                    type: string
                    description: The worker key.
                    example: workerKey
                  workerLink:
                    type: string
                    format: uri
                    description: A link that opens the worker page already signed in.
                    example: https://proofpay-on99.onrender.com
                description: The create project object.
              example:
                id: id
                workerKey: workerKey
                workerLink: https://proofpay-on99.onrender.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: The hosted demo has reached its project limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: &id003
                error: no such project
  /api/projects/{id}:
    get:
      tags:
      - Projects
      operationId: getProject
      summary: Read one project
      description: |
        The public view: donations, totals, stages and each stage's submissions. Send
        `X-Worker-Key` to also receive the one-time code of the active stage.
      security:
      - {}
      - WorkerKey: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example: &id016
                id: P1
                title: Repair the village hand pump
                startedAt: '2026-11-01T09:00:00.000Z'
                currency: USD
                worker: &id013
                  name: Ravi Kumar
                site: *id001
                donations: &id014
                - id: P1
                  donor: Asha
                  amount: 25
                  status: AWAITING_APPROVAL
                  released: '10.00'
                totals: &id005
                  reserved: '30.00'
                  captured: '10.00'
                  paid: '10.00'
                  inTransit: '0.00'
                  problem: '0.00'
                holdExpiresAt: '2026-11-30T09:00:00.000Z'
                stages: &id015
                - id: P1
                  index: 0
                  title: Repair the village hand pump
                  spec: The new pump head is installed and bolted to the base.
                  pct: 40
                  window:
                    from: '2026-11-01T00:00:00Z'
                    to: '2026-11-30T23:59:59Z'
                  status: PENDING
                  release:
                    ok: true
                    reason: capture failed
                    payout:
                      amount: '25'
                      status: ACTIVE
                    captures: &id002
                    - {}
                  releasedAt: '2026-11-10T19:10:12.000Z'
                  code: 7K2Q
                  submissions: &id012
                  - id: P1
                    status: RECEIVED
                    receivedAt: '2026-11-10T19:09:04.352Z'
                    decision: RELEASE
                    reasons: &id011
                    - code-missing
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/audit:
    get:
      tags:
      - Projects
      operationId: getAuditLog
      summary: Read the audit log and check its hash chain
      description: Every decision is an entry that includes the hash of the one before it, so altering
        history breaks the chain.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: The audit entries and the result of verifying the chain.
          content:
            application/json:
              schema:
                type: object
                required:
                - chain
                - entries
                properties:
                  chain:
                    type: object
                    description: Result of re-computing the hash chain.
                    properties:
                      ok:
                        type: boolean
                        description: The ok.
                        example: true
                    additionalProperties: true
                  entries:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      description: The entries.
                    description: The entries.
                    example: []
                description: The get audit log object.
              example:
                chain:
                  ok: true
                entries:
                - {}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/projects/{id}/donations:
    post:
      tags:
      - Donations
      operationId: createDonation
      summary: Reserve a donation on PayPal
      description: |
        Creates a PayPal order with intent AUTHORIZE: the money stays in the donor's account and
        is only reserved. On the sandbox, send the donor to `approveUrl` to approve it; they are
        then returned to the site and the reservation is confirmed. In mock mode there is no
        approval step and the donation is confirmed immediately.
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - donor
              - amount
              properties:
                donor:
                  type: string
                  minLength: 1
                  maxLength: 60
                  example: Asha
                  description: The donor.
                amount:
                  type: number
                  minimum: 1
                  maximum: 1000
                  multipleOf: 0.01
                  example: 25
                  description: The amount.
              description: The create donation object.
            example:
              donor: Asha
              amount: 25
        description: Who is donating and how much.
      responses:
        '201':
          description: Donation created.
          content:
            application/json:
              schema:
                type: object
                required:
                - donationId
                - status
                properties:
                  donationId:
                    type: string
                    description: The donation id.
                    example: donationId
                  status:
                    $ref: '#/components/schemas/DonationStatus'
                  approveUrl:
                    type: string
                    format: uri
                    nullable: true
                    description: Where the donor approves the reservation. Absent in mock mode.
                    example: https://proofpay-on99.onrender.com
                description: The create donation object.
              example:
                donationId: donationId
                status: AWAITING_APPROVAL
                approveUrl: https://proofpay-on99.onrender.com
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/donate/return:
    get:
      tags:
      - Donations
      operationId: donationReturn
      summary: PayPal return link (browser redirect)
      description: |
        PayPal sends the donor's browser here after approval with `?token=<order id>`. It confirms
        the reservation and redirects back to the site. This is not meant to be called by an API client.
      parameters:
      - name: project
        in: query
        required: true
        schema:
          type: string
          description: Project id.
          example: P1
        description: Project id.
      - name: donation
        in: query
        required: true
        schema:
          type: string
          description: Donation id.
          example: D1
        description: Donation id.
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: The PayPal order id.
          example: 5O190127
        description: The PayPal order id.
      responses:
        '302':
          description: Redirect to the project page (`donated=1`, or an `error=` value).
          headers:
            Location:
              schema:
                type: string
                description: A relative or absolute URL.
                example: /?project=P1&donated=1
              description: Where the browser is sent next.
  /api/projects/{id}/stages/{stageId}/submissions:
    post:
      tags:
      - Evidence
      operationId: submitEvidence
      summary: Upload photo evidence for a stage
      description: |
        The body is the raw image (JPEG or PNG), not a form. The server checks for duplicates,
        location and time from the photo's metadata, and that the one-time code is visible, then
        asks two independent AI reviewers. The deterministic gate decides: RELEASE, RESUBMIT,
        HOLD (a human decides) or BLOCK. On RELEASE each donor's share is captured and the worker
        is paid.

        On a demo server with simulated reviewers, `demoCode`, `demoMatch` and `demoFlags` steer
        the simulated reviewers; they are ignored when real reviewers are used.
      security:
      - WorkerKey: []
      parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: stageId
        in: path
        required: true
        schema:
          type: string
          description: Stage id within the project.
          example: S1
        description: Stage id within the project.
      - name: demoCode
        in: query
        required: false
        schema:
          type: string
          description: Simulated reviewers only. The code they report seeing.
          example: demoCode
        description: Simulated reviewers only. The code they report seeing.
      - name: demoMatch
        in: query
        required: false
        schema:
          type: string
          description: Simulated reviewers only. Send 0 to make the simulated reviewers say the photo
            does not match the stage; any other value means it matches.
          example: '0'
        description: Simulated reviewers only. Send 0 to make the simulated reviewers say the photo does
          not match the stage; any other value means it matches.
      - name: demoFlags
        in: query
        required: false
        schema:
          type: string
          description: Simulated reviewers only. Comma-separated suspicion flags.
          example: demoFlags
        description: Simulated reviewers only. Comma-separated suspicion flags.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
              description: The submit evidence object.
              example: photo.jpg
          image/png:
            schema:
              type: string
              format: binary
              description: The submit evidence object.
              example: photo.jpg
        description: The raw photo bytes (JPEG or PNG).
      responses:
        '200':
          description: The decision for this submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
              example: &id020
                decision: RELEASE
                status: RECEIVED
                submissionId: S1-1
                reasons: &id017
                - rule: code-missing
                checks: &id018
                - id: duplicate
                  status: pass
                  detail: Photo taken 12 m from the site
                reviews: &id019
                - reviewer: checklist
                  matchesSpec: true
                  confidence: 0.9
                  observations: A new green pump is bolted to the concrete base.
                  visibleCode: 7K2Q
                  suspicion:
                  - suspicion
                  textInImage: 7K2Q
                  error: no such project
                release: &id004
                  ok: true
                  reason: capture failed
                  payout: &id010
                    amount: '25'
                    status: ACTIVE
                  captures: *id002
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The stage is not accepting evidence (it is not the active stage).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
        '413':
          description: The upload is larger than `maxUploadBytes`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
        '415':
          description: The file is not a JPEG or PNG.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
        '429':
          description: The hourly AI review quota has been reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
  /api/images/{projectId}/{subId}:
    get:
      tags:
      - Evidence
      operationId: getEvidenceImage
      summary: Fetch an evidence photo
      description: Public only after the submission has released funds. Before that, the worker or verifier
        key is required.
      security:
      - {}
      - WorkerKey: []
      - VerifierKey: []
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: Project id.
          example: P1
        description: Project id.
      - name: subId
        in: path
        required: true
        schema:
          type: string
          description: Submission id.
          example: S1-1
        description: Submission id.
      responses:
        '200':
          description: The photo.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
                description: The get evidence image object.
                example: photo.jpg
            image/png:
              schema:
                type: string
                format: binary
                description: The get evidence image object.
                example: photo.jpg
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/verify/queue:
    get:
      tags:
      - Verification
      operationId: getVerifierQueue
      summary: Submissions waiting for a human
      description: Submissions the gate held for review, and ones whose payment release failed and needs
        a retry.
      security:
      - VerifierKey: []
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueItem'
                description: The get verifier queue object.
                example: []
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/verify/{projectId}/{submissionId}:
    post:
      tags:
      - Verification
      operationId: decideSubmission
      summary: Approve or reject a held submission
      description: |
        Approval is bound to the evidence the verifier saw: send the `evidenceHash` from the queue
        item. If the evidence changed since, the call fails with 409 and nothing is released.
      security:
      - VerifierKey: []
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
          description: Project id.
          example: P1
        description: Project id.
      - name: submissionId
        in: path
        required: true
        schema:
          type: string
          description: Submission id from the verifier queue.
          example: S1-1
        description: Submission id from the verifier queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                  description: The decision.
                  example: approve
                evidenceHash:
                  type: string
                  description: The hash from the queue item. Required to approve.
                  example: evidenceHash
              description: The decide submission object.
            example:
              decision: approve
              evidenceHash: evidenceHash
        description: The verifier decision.
      responses:
        '200':
          description: The submission's new status.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    $ref: '#/components/schemas/SubmissionStatus'
                  release:
                    $ref: '#/components/schemas/Release'
                description: The decide submission object.
              example:
                status: RECEIVED
                release: *id004
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The submission is not awaiting review, or the evidence changed since it was shown.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
        '502':
          description: PayPal returned an error. Nothing was released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example: *id003
components:
  securitySchemes:
    WorkerKey:
      type: apiKey
      in: header
      name: X-Worker-Key
      description: Secret key returned when the project is created. Lets the worker upload evidence.
    VerifierKey:
      type: apiKey
      in: header
      name: X-Verifier-Key
      description: Key held by the human verifier. Lets them read the queue and decide held cases.
    OrganizerKey:
      type: apiKey
      in: header
      name: X-Organizer-Key
      description: Optional key some servers require to create projects.
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Project id.
      example: P1
  responses:
    BadRequest:
      description: The request was invalid. The message says what to fix.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: no such project
    Unauthorized:
      description: A required key is missing or wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: no such project
    Forbidden:
      description: The key does not allow this, or the evidence is not public yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: no such project
    NotFound:
      description: No such project, stage or submission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: no such project
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: no such project
          description: What went wrong, in plain words.
      example: *id003
      description: The error object.
    DonationStatus:
      type: string
      enum:
      - AWAITING_APPROVAL
      - CONFIRMED
      - FAILED
      description: AWAITING_APPROVAL = waiting for the donor at PayPal; CONFIRMED = the money is reserved;
        FAILED = not approved.
      example: AWAITING_APPROVAL
    StageStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - RELEASED
      description: The stage status object.
      example: PENDING
    SubmissionStatus:
      type: string
      enum:
      - RECEIVED
      - RELEASED
      - PENDING_REVIEW
      - RESUBMIT
      - BLOCKED
      - REJECTED
      - RELEASE_FAILED
      description: The submission status object.
      example: RECEIVED
    Decision:
      type: string
      enum:
      - RELEASE
      - RESUBMIT
      - HOLD
      - BLOCK
      description: The decision object.
      example: RELEASE
    Totals:
      type: object
      description: Amounts in the project currency. `paid` counts only payouts PayPal has settled.
      properties:
        reserved:
          type: string
          example: '30.00'
          description: Total reserved on PayPal from donors, not yet taken.
        captured:
          type: string
          example: '10.00'
          description: Total taken from donors so far.
        paid:
          type: string
          example: '10.00'
          description: Total paid to the worker and settled by PayPal.
        inTransit:
          type: string
          example: '0.00'
          description: Paid out but not yet settled by PayPal.
        problem:
          type: string
          example: '0.00'
          description: Payouts that failed, were returned or are unclaimed.
      example: *id005
    ProjectSummary:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
          example: P1
        title:
          type: string
          description: Short human-readable title.
          example: Repair the village hand pump
        totals:
          $ref: '#/components/schemas/Totals'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/StageStatus'
          description: The stages of the project, in order.
          example: []
      description: The project summary object.
      example:
        id: P1
        title: Repair the village hand pump
        totals: *id005
        stages:
        - PENDING
    Site:
      type: object
      required:
      - lat
      - lon
      - radiusM
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude of the job site in degrees.
          example: 12.9716
        lon:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude of the job site in degrees.
          example: 77.5946
        radiusM:
          type: number
          minimum: 10
          maximum: 5000
          description: Photos must be taken within this many metres.
          example: 150
      description: The site object.
      example: *id001
    TimeWindow:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
          format: date-time
          description: Start of the window (ISO 8601).
          example: '2026-11-01T00:00:00Z'
        to:
          type: string
          format: date-time
          description: End of the window (ISO 8601).
          example: '2026-11-30T23:59:59Z'
      description: The time window object.
      example: &id006
        from: '2026-11-01T00:00:00Z'
        to: '2026-11-30T23:59:59Z'
    NewStage:
      type: object
      required:
      - title
      - spec
      - pct
      - window
      properties:
        title:
          type: string
          description: Short human-readable title.
          example: Repair the village hand pump
        spec:
          type: string
          description: What the photo must show. The AI reviewers judge against this.
          example: The new pump head is installed and bolted to the base.
        pct:
          type: integer
          minimum: 1
          description: Share of the total released at this stage. All stages must sum to 100.
          example: 40
        window:
          $ref: '#/components/schemas/TimeWindow'
      description: The new stage object.
      example:
        title: Repair the village hand pump
        spec: The new pump head is installed and bolted to the base.
        pct: 40
        window: *id006
    NewProject:
      type: object
      required:
      - title
      - worker
      - site
      - stages
      properties:
        title:
          type: string
          maxLength: 100
          example: Repair the village hand pump
          description: Short human-readable title.
        worker:
          type: object
          required:
          - name
          - email
          properties:
            name:
              type: string
              description: Full name.
              example: Ravi Kumar
            email:
              type: string
              format: email
              description: The PayPal account that gets paid. Never published.
              example: ravi@example.com
          description: The person who does the work and gets paid.
          example: *id007
        site:
          $ref: '#/components/schemas/Site'
        stages:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: '#/components/schemas/NewStage'
          description: The stages of the project, in order.
          example: *id008
      description: The new project object.
      example: *id009
    Donation:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
          example: P1
        donor:
          type: string
          description: Display name of the donor.
          example: Asha
        amount:
          type: number
          description: Amount in the project currency.
          example: 25
        status:
          $ref: '#/components/schemas/DonationStatus'
        released:
          type: string
          description: How much of this donation has been captured so far.
          example: '10.00'
      description: The donation object.
      example:
        id: P1
        donor: Asha
        amount: 25
        status: AWAITING_APPROVAL
        released: '10.00'
    Payout:
      type: object
      description: The PayPal payout to the worker for a stage. PayPal settles it after accepting it.
      additionalProperties: true
      properties:
        amount:
          type: string
          description: Amount in the project currency.
          example: '25'
        status:
          type: string
          description: PayPal's own payout status (for example PENDING or SUCCESS).
          example: ACTIVE
      example: *id010
    Release:
      type: object
      properties:
        ok:
          type: boolean
          description: Whether the operation succeeded.
          example: true
        reason:
          type: string
          description: Why it failed, if it did.
          example: capture failed
        payout:
          $ref: '#/components/schemas/Payout'
        captures:
          type: array
          items:
            type: object
            additionalProperties: true
            description: The captures.
          description: Per-donor captures made for this release.
          example: *id002
      description: The release object.
      example: *id004
    SubmissionSummary:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
          example: P1
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        receivedAt:
          type: string
          format: date-time
          description: When the server received the photo (ISO 8601, UTC).
          example: '2026-11-10T19:09:04.352Z'
        decision:
          $ref: '#/components/schemas/Decision'
        reasons:
          type: array
          items:
            type: string
            description: Rule id such as duplicate-evidence or code-missing.
            example: reasons
          description: Why the gate decided this way, as rule ids such as duplicate-evidence or code-missing.
          example: *id011
      description: The submission summary object.
      example:
        id: P1
        status: RECEIVED
        receivedAt: '2026-11-10T19:09:04.352Z'
        decision: RELEASE
        reasons: *id011
    Stage:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
          example: P1
        index:
          type: integer
          description: Position of the stage, starting at 0.
          example: 0
        title:
          type: string
          description: Short human-readable title.
          example: Repair the village hand pump
        spec:
          type: string
          description: What the photo must show for this stage. The AI reviewers judge against this text.
          example: The new pump head is installed and bolted to the base.
        pct:
          type: integer
          description: Share of the total released at this stage, as a whole percent. All stages sum to
            100.
          example: 40
        window:
          $ref: '#/components/schemas/TimeWindow'
        status:
          $ref: '#/components/schemas/StageStatus'
        release:
          $ref: '#/components/schemas/Release'
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When the stage payment was released (ISO 8601, UTC).
          example: '2026-11-10T19:10:12.000Z'
        code:
          type: string
          description: The one-time code to write on paper in the photo. Only returned to the worker,
            only while the stage is ACTIVE.
          example: 7K2Q
        submissions:
          type: array
          items:
            $ref: '#/components/schemas/SubmissionSummary'
          description: Evidence uploads for this stage.
          example: *id012
      description: The stage object.
      example:
        id: P1
        index: 0
        title: Repair the village hand pump
        spec: The new pump head is installed and bolted to the base.
        pct: 40
        window: *id006
        status: PENDING
        release: *id004
        releasedAt: '2026-11-10T19:10:12.000Z'
        code: 7K2Q
        submissions: *id012
    Project:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier.
          example: P1
        title:
          type: string
          description: Short human-readable title.
          example: Repair the village hand pump
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: When the project was created (ISO 8601, UTC).
          example: '2026-11-01T09:00:00.000Z'
        currency:
          type: string
          example: USD
          description: ISO 4217 currency code of every amount in the project.
        worker:
          type: object
          properties:
            name:
              type: string
              description: Full name.
              example: Ravi Kumar
          description: The person who does the work and gets paid.
          example: *id013
        site:
          $ref: '#/components/schemas/Site'
        donations:
          type: array
          items:
            $ref: '#/components/schemas/Donation'
          description: Every donation to the project.
          example: *id014
        totals:
          $ref: '#/components/schemas/Totals'
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: When the earliest PayPal reservation lapses.
          example: '2026-11-30T09:00:00.000Z'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/Stage'
          description: The stages of the project, in order.
          example: *id015
      description: The project object.
      example: *id016
    Check:
      type: object
      properties:
        id:
          type: string
          enum:
          - duplicate
          - location
          - time
          - code
          description: Unique identifier.
          example: duplicate
        status:
          type: string
          enum:
          - pass
          - fail
          - unknown
          description: Current state.
          example: pass
        detail:
          type: string
          description: Explanation of the result.
          example: Photo taken 12 m from the site
      description: The check object.
      example:
        id: duplicate
        status: pass
        detail: Photo taken 12 m from the site
    Review:
      type: object
      description: One independent AI reviewer's structured opinion. It advises; it never decides.
      additionalProperties: true
      properties:
        reviewer:
          type: string
          description: Which reviewer produced this opinion.
          example: checklist
        matchesSpec:
          type: boolean
          description: Whether the photo shows what the stage requires.
          example: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: How sure the reviewer is, from 0 to 1.
          example: 0.9
        observations:
          type: string
          description: What the reviewer saw, in plain words.
          example: A new green pump is bolted to the concrete base.
        visibleCode:
          type: string
          nullable: true
          description: The one-time code the reviewer read in the photo, or null.
          example: 7K2Q
        suspicion:
          type: array
          items:
            type: string
            description: The suspicion.
            example: suspicion
          description: Flags raised about the photo, such as screen-photo.
          example: []
        textInImage:
          type: string
          nullable: true
          description: Text read out of the photo. Treated as data, never as instructions.
          example: 7K2Q
        error:
          type: string
          description: What went wrong, in plain words.
          example: no such project
      example:
        reviewer: checklist
        matchesSpec: true
        confidence: 0.9
        observations: A new green pump is bolted to the concrete base.
        visibleCode: 7K2Q
        suspicion:
        - suspicion
        textInImage: 7K2Q
        error: no such project
    SubmissionResult:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        submissionId:
          type: string
          description: Id of the submission.
          example: S1-1
        reasons:
          type: array
          items:
            type: object
            additionalProperties: true
            description: The reasons.
          description: Why the gate decided this way, as rule ids such as duplicate-evidence or code-missing.
          example: *id017
        checks:
          type: array
          items:
            $ref: '#/components/schemas/Check'
          description: Results of the deterministic checks.
          example: *id018
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/Review'
          description: Opinions of the two independent AI reviewers.
          example: *id019
        release:
          $ref: '#/components/schemas/Release'
      description: The submission result object.
      example: *id020
    QueueItem:
      type: object
      properties:
        projectId:
          type: string
          description: Id of the project.
          example: P1
        projectTitle:
          type: string
          description: Title of the project.
          example: Repair the village hand pump
        stage:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier.
              example: P1
            title:
              type: string
              description: Short human-readable title.
              example: Repair the village hand pump
            spec:
              type: string
              description: What the photo must show for this stage. The AI reviewers judge against this
                text.
              example: The new pump head is installed and bolted to the base.
          description: The stage this item belongs to.
          example: &id024
            id: P1
            title: Repair the village hand pump
            spec: The new pump head is installed and bolted to the base.
        submission:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              description: Unique identifier.
              example: P1
            status:
              $ref: '#/components/schemas/SubmissionStatus'
            releaseError:
              type: string
              nullable: true
              description: Why the payment release failed, if it did.
              example: PayPal timeout
            receivedAt:
              type: string
              format: date-time
              description: When the server received the photo (ISO 8601, UTC).
              example: '2026-11-10T19:09:04.352Z'
            facts:
              type: object
              additionalProperties: true
              description: 'Facts read from the photo: time, location, perceptual hash.'
            reviews:
              type: array
              items:
                $ref: '#/components/schemas/Review'
              description: Opinions of the two independent AI reviewers.
              example: &id021
              - reviewer: checklist
                matchesSpec: true
                confidence: 0.9
                observations: A new green pump is bolted to the concrete base.
                visibleCode: 7K2Q
                suspicion:
                - suspicion
                textInImage: 7K2Q
                error: no such project
            reasons:
              type: array
              items:
                type: object
                additionalProperties: true
                description: The reasons.
              description: Why the gate decided this way, as rule ids such as duplicate-evidence or code-missing.
              example: &id022
              - rule: code-missing
            checks:
              type: array
              items:
                $ref: '#/components/schemas/Check'
              description: Results of the deterministic checks.
              example: &id023
              - id: duplicate
                status: pass
                detail: Photo taken 12 m from the site
          description: The submission waiting for review.
          example: &id025
            id: P1
            status: RECEIVED
            releaseError: PayPal timeout
            receivedAt: '2026-11-10T19:09:04.352Z'
            facts: {}
            reviews: *id021
            reasons: *id022
            checks: *id023
        evidenceHash:
          type: string
          description: Fingerprint of the evidence the verifier is approving. Send it back unchanged.
          example: 9f2c1b7a
        imageUrl:
          type: string
          description: Path of the evidence photo.
          example: /api/images/P1/S1-1
      description: The queue item object.
      example:
        projectId: P1
        projectTitle: Repair the village hand pump
        stage: *id024
        submission: *id025
        evidenceHash: 9f2c1b7a
        imageUrl: /api/images/P1/S1-1
externalDocs:
  description: Source code and README
  url: https://github.com/shreesh1802/tollgate
